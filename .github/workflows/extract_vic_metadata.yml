name: Retry Batch 037 finance

on:
  push:
    paths:
      - '.github/workflows/extract_vic_metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reuse prior generator with fix
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/extract_vic_metadata.yml > /tmp/old.yml
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/old.yml').read_text()
          marker="          python - <<'PY'\n"
          a=s.index(marker)+len(marker)
          b=s.index("\n          PY\n",a)
          code=s[a:b]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          code=code.replace("m['year']==2009", "int(m['date'][:4])==2009")
          exec(compile(code,'batch037_generator','exec'),{})
          PY
          test -s /tmp/b037.md && test -s /tmp/b037.json
          cp /tmp/b037.md analysis/batch_037_cit_cacc_ally_10.md
          git config user.name 'VIC research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis/batch_037_cit_cacc_ally_10.md
          git commit -m 'analysis: add Batch 037 finance postmortems'
          git push
      - name: Commit validated JSON
        shell: bash
        run: |
          git pull --rebase
          cp /tmp/b037.json data/curated/batch_037_cit_cacc_ally_deep_v7.json
          python - <<'PY'
          import json
          p=json.load(open('data/curated/batch_037_cit_cacc_ally_deep_v7.json',encoding='utf-8'))
          assert len(p['ideas_master'])==10 and len(p['postmortems'])==10
          assert len(p['sections'])==100 and len(p['claims'])==60 and len(p['metrics'])==40 and len(p['timeline'])==60 and len(p['sources'])==60
          assert len({x['idea_id'] for x in p['ideas_master']})==10
          for x in p['ideas_master']:
              assert sum(c['thesis_weight_pct'] for c in p['claims'] if c['idea_id']==x['idea_id'])==100
          assert all(x['research_direction_ko'].startswith('Long') for x in p['postmortems'])
          assert [x['security_instrument_ko'] for x in p['postmortems'] if x['idea_id']=='f2dc229e-52b4-4b56-ae6b-ca21f91e3415']==['Senior unsecured bonds']
          PY
          git add data/curated/batch_037_cit_cacc_ally_deep_v7.json
          git commit -m 'data: add validated Batch 037 deep v7'
          git push
      - name: Register and final verify
        shell: bash
        run: |
          git pull --rebase
          python - <<'PY'
          from pathlib import Path
          p=Path('app/components/batch_report.py');s=p.read_text(encoding='utf-8')
          e='    ("batch_037_cit_cacc_ally_deep_v7.json", "batch_037_cit_cacc_ally_10.md", "Batch 037"),\n'
          marker='    ("all_reviewed_v8_index.json", "all_reviewed_v8.md.gz", "V8 전체 DB"),'
          if 'Batch 037' not in s:
              assert marker in s
              s=s.replace(marker,e+marker);p.write_text(s,encoding='utf-8')
          PY
          git add app/components/batch_report.py
          git commit -m 'app: register Batch 037'
          git push
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('data/curated/batch_037_cit_cacc_ally_deep_v7.json',encoding='utf-8'))
          assert [len(p[k]) for k in ['ideas_master','sections','claims','metrics','timeline','sources']]==[10,100,60,40,60,60]
          assert len(p['postmortems'])==10 and len({x['idea_id'] for x in p['ideas_master']})==10
          for x in p['ideas_master']: assert sum(c['thesis_weight_pct'] for c in p['claims'] if c['idea_id']==x['idea_id'])==100
          assert Path('analysis/batch_037_cit_cacc_ally_10.md').stat().st_size>10000
          assert 'Batch 037' in Path('app/components/batch_report.py').read_text(encoding='utf-8')
          print('BATCH037 FINAL VERIFIED')
          PY
          payload={'schema_version':'deep_v7','batch':'035','title':'PLUS ticker collision: ePlus, Plus500 and Level 3 direction-audit postmortems','research_asof':'2026-09-05','ideas_master':ideas,'postmortems':posts,'sections':sections,'claims':claims,'metrics':metrics,'timeline':timeline,'sources':sources}

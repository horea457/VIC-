name: Extract VIC metadata

on:
  push:
    paths:
      - '.github/workflows/extract_vic_metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect schema and performance
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1XdHbJu35eyJdMoHMyycudDjyCvrEmIBW' -O /tmp/VIC_IDEAS.sql
          python - <<'PY'
          import json,pathlib
          old=json.load(open('data/curated/batch_034_comstock_crocodile_franklincovey_deep_v7.json',encoding='utf-8'))
          schema={'top_keys':list(old.keys()),'arrays':{}}
          for k,v in old.items():
              if isinstance(v,list):
                  schema['arrays'][k]={'count':len(v),'sample':v[0] if v else None}
          ids={x['idea_id'] for x in json.load(open('data/curated/source_batch035_manifest.json',encoding='utf-8'))['ideas']}
          def u(v):
              if v==r'\N': return None
              return v.replace(r'\t','\t').replace(r'\n','\n').replace(r'\\','\\')
          perf={}; cur=None
          with open('/tmp/VIC_IDEAS.sql',encoding='utf-8',errors='replace') as f:
              for line in f:
                  if line.startswith('COPY public.'):
                      cur=line.split('COPY public.',1)[1].split(' ',1)[0]; continue
                  if cur and line.rstrip('\n')==r'\.': cur=None; continue
                  if cur!='performance': continue
                  v=[u(x) for x in line.rstrip('\n').split('\t')]
                  if len(v)>=12 and v[0] in ids:
                      names=['idea_id','nextDayOpen','nextDayClose','oneWeekClosePerf','twoWeekClosePerf','oneMonthPerf','threeMonthPerf','sixMonthPerf','oneYearPerf','twoYearPerf','threeYearPerf','fiveYearPerf']
                      perf[v[0]]=dict(zip(names,v))
          pathlib.Path('data/curated/source_batch035_schema_perf.json').write_text(json.dumps({'schema':schema,'performance':perf},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'VIC metadata bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/curated/source_batch035_schema_perf.json
          git commit -m 'chore: inspect Batch 035 schema and performance' || exit 0
          git push

name: Census next VIC ideas

on:
  push:
    paths:
      - '.github/workflows/extract_vic_metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unreviewed census
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1XdHbJu35eyJdMoHMyycudDjyCvrEmIBW' -O /tmp/VIC_IDEAS.sql
          python - <<'PY'
          import pathlib,glob,json,collections
          def u(v):
              if v==r'\N': return None
              out=[];i=0
              while i<len(v):
                  if v[i]=='\\' and i+1<len(v):
                      c=v[i+1];out.append({'n':'\n','r':'\r','t':'\t','b':'\b','f':'\f','v':'\v'}.get(c,c));i+=2
                  else: out.append(v[i]);i+=1
              return ''.join(out)
          processed=set()
          for fn in glob.glob('data/curated/*.json'):
              n=pathlib.Path(fn).name
              if n.startswith('source_') or n=='all_reviewed_v8_index.json': continue
              try:d=json.load(open(fn,encoding='utf-8'))
              except:continue
              for key in ('ideas_master','postmortems'):
                  for x in d.get(key,[]):
                      if x.get('idea_id'): processed.add(str(x['idea_id']))
          ideas=[];cur=None
          with open('/tmp/VIC_IDEAS.sql',encoding='utf-8',errors='replace') as f:
              for line in f:
                  if line.startswith('COPY public.'):
                      cur=line.split('COPY public.',1)[1].split(' ',1)[0];continue
                  if cur and line.rstrip('\n')==r'\.':cur=None;continue
                  if cur!='ideas':continue
                  v=[u(x) for x in line.rstrip('\n').split('\t')]
                  if len(v)>=7 and v[0] not in processed:
                      ideas.append({'idea_id':v[0],'source_link':v[1],'ticker':v[2],'user_link':v[3],'date':v[4],'is_short':v[5]=='t','contest_winner':v[6]=='t'})
          by=collections.defaultdict(list)
          for r in ideas: by[r['ticker']].append(r)
          rows=[]
          for t,rs in by.items():
              rs.sort(key=lambda x:(x['date'] or '',x['idea_id']))
              rows.append({'ticker':t,'count':len(rs),'earliest':rs[0]['date'],'latest':rs[-1]['date'],'sample_ids':[x['idea_id'] for x in rs[:12]],'shorts':sum(x['is_short'] for x in rs),'longs':sum(not x['is_short'] for x in rs)})
          rows.sort(key=lambda x:(-x['count'],x['ticker'] or ''))
          out={'processed_count':len(processed),'unreviewed_count':len(ideas),'ticker_count':len(rows),'top_tickers':rows[:120]}
          pathlib.Path('data/curated/next_unreviewed_census.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(out['processed_count'],out['unreviewed_count'],out['ticker_count'])
          PY
      - name: Commit census
        run: |
          git config user.name 'VIC metadata bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/curated/next_unreviewed_census.json
          git commit -m 'chore: update unreviewed VIC census' || exit 0
          git push
name: Extract VIC metadata

on:
  push:
    paths:
      - '.github/workflows/extract_vic_metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore SQLite and inspect source metadata
        shell: bash
        run: |
          set -euo pipefail
          cat data/processed/vic_dashboard.db.gz.part* > /tmp/vic_dashboard.db.gz
          gzip -dc /tmp/vic_dashboard.db.gz > /tmp/vic_dashboard.db
          python - <<'PY'
          import sqlite3, json, pathlib
          db='/tmp/vic_dashboard.db'
          con=sqlite3.connect(db)
          con.row_factory=sqlite3.Row
          tables=[r[0] for r in con.execute("select name from sqlite_master where type='table' order by name")]
          schema={}
          for t in tables:
              schema[t]=[dict(r) for r in con.execute(f"pragma table_info('{t}')")]
          out={'tables':tables,'schema':schema}
          pathlib.Path('data/curated/source_schema_probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit probe
        shell: bash
        run: |
          git config user.name 'VIC metadata bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/curated/source_schema_probe.json
          git commit -m 'chore: probe VIC source schema' || exit 0
          git push

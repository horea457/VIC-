name: Scan finance candidates

on:
  push:
    paths:
      - '.github/workflows/extract_vic_metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan finance tickers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1XdHbJu35eyJdMoHMyycudDjyCvrEmIBW' -O /tmp/VIC_IDEAS.sql
          python - <<'PY'
          import pathlib,glob,json,collections
          def u(v):
              if v==r'\N': return None
              return v.replace(r'\t','\t').replace(r'\n','\n').replace(r'\\','\\')
          processed=set()
          for fn in glob.glob('data/curated/*.json'):
              n=pathlib.Path(fn).name
              if n.startswith('source_') or n in ('all_reviewed_v8_index.json','next_unreviewed_census.json','finance_candidate_census.json'):continue
              try:d=json.load(open(fn,encoding='utf-8'))
              except:continue
              for key in ('ideas_master','postmortems'):
                  for x in d.get(key,[]):
                      if x.get('idea_id'):processed.add(str(x['idea_id']))
          wanted=set('CIT CACC SC OMF ALLY COF DFS SYF AXP NAVI SLM ENVA PRAA ECPG FCFS EZPW TREE LC UPST SOFI AFRM GDOT PYPL COF Discover DFS SYF'.split())
          rows=collections.defaultdict(list);cur=None
          with open('/tmp/VIC_IDEAS.sql',encoding='utf-8',errors='replace') as f:
              for line in f:
                  if line.startswith('COPY public.'):
                      cur=line.split('COPY public.',1)[1].split(' ',1)[0];continue
                  if cur and line.rstrip('\n')==r'\.':cur=None;continue
                  if cur!='ideas':continue
                  v=[u(x) for x in line.rstrip('\n').split('\t')]
                  if len(v)>=7 and v[0] not in processed and v[2] in wanted:
                      rows[v[2]].append({'idea_id':v[0],'date':v[4],'is_short':v[5]=='t','source_link':v[1]})
          out=[]
          for t,rs in rows.items():
              rs.sort(key=lambda x:(x['date'] or '',x['idea_id']))
              out.append({'ticker':t,'count':len(rs),'shorts':sum(x['is_short'] for x in rs),'longs':sum(not x['is_short'] for x in rs),'ideas':rs})
          out.sort(key=lambda x:(-x['count'],x['ticker']))
          pathlib.Path('data/curated/finance_candidate_census.json').write_text(json.dumps({'processed_count':len(processed),'candidates':out},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit scan
        run: |
          git config user.name 'VIC metadata bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/curated/finance_candidate_census.json
          git commit -m 'chore: scan finance candidates' || exit 0
          git push
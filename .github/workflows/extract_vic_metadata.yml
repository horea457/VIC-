name: Extract VIC metadata

on:
  push:
    paths:
      - '.github/workflows/extract_vic_metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download public full VIC SQL and inspect COPY schema
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1XdHbJu35eyJdMoHMyycudDjyCvrEmIBW' -O /tmp/VIC_IDEAS.sql
          python - <<'PY'
          import pathlib, re, json, os
          p=pathlib.Path('/tmp/VIC_IDEAS.sql')
          headers=[]
          sample=[]
          with p.open('r',encoding='utf-8',errors='replace') as f:
              for i,line in enumerate(f):
                  if line.startswith('COPY '): headers.append(line.rstrip())
                  if i<80: sample.append(line.rstrip())
          out={'bytes':p.stat().st_size,'copy_headers':headers,'first_80_lines':sample}
          pathlib.Path('data/curated/source_full_sql_probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit probe
        shell: bash
        run: |
          git config user.name 'VIC metadata bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/curated/source_full_sql_probe.json
          git commit -m 'chore: probe full VIC SQL source' || exit 0
          git push

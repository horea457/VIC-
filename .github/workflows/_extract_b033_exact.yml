name: Extract B033 exact
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_extract_b033_exact.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_extract_b033_exact.py
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add .vic_tmp/b033_exact.json
          git commit -m 'Save exact Batch 033 source rows'
          git push origin main

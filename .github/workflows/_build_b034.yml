name: Build Batch 034 sequentially
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_build_b034.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_build_batch_034.py
      - name: Commit analysis
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add analysis/batch_034_comstock_crocodile_franklincovey_10.md
          git commit -m 'Add Batch 034 CRK FC analysis'
          git push origin main
      - name: Commit curated JSON
        run: |
          git add data/curated/batch_034_comstock_crocodile_franklincovey_deep_v7.json
          git commit -m 'Add Batch 034 CRK FC curated data'
          git push origin main
      - name: Register report
        run: |
          git add app/components/batch_report.py
          git commit -m 'Register Batch 034 report'
          git push origin main

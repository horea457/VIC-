name: Solve Batch 042 chunk order

on:
  push:
    paths:
      - '.github/workflows/build_batch_042.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brute-force chunk order against gzip ISIZE
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,struct,itertools
          # 3 and 4 are identical; use 3 as representative.
          mids=['3a','3','4a','4b','4c']
          raw={n:bytearray(base64.b64decode(Path(f'.github/batch042_payload_{n}.txt').read_text().strip())) for n in ['1','2','3','3a','4a','4b','4c','5']}
          raw['1'][4736]=48
          rows=[]
          matches=[]
          for L in range(1,len(mids)+1):
            for perm in itertools.permutations(mids,L):
              seq=('1','2')+perm+('5',)
              buf=bytearray().join(raw[n] for n in seq)
              # gzip header start; constant from chunk1
              p=10; flg=buf[3]
              if flg&8:
                while buf[p]!=0: p+=1
                p+=1
              exp_crc=struct.unpack('<I',bytes(buf[-8:-4]))[0]
              exp_size=struct.unpack('<I',bytes(buf[-4:]))[0]
              d=zlib.decompressobj(-zlib.MAX_WBITS)
              try:
                out=d.decompress(bytes(buf[p:-8]))+d.flush()
                err=''
              except Exception as e:
                out=b''; err=repr(e)
              crc=zlib.crc32(out)&0xffffffff
              score=(0 if len(out)==exp_size else abs(len(out)-exp_size), 0 if crc==exp_crc else 1)
              rows.append((score,len(out),crc,seq,err))
              if len(out)==exp_size and crc==exp_crc:
                matches.append((seq,out))
          rows.sort(key=lambda x:(x[0][0],x[0][1],-x[1]))
          print('MATCH_COUNT',len(matches))
          for seq,out in matches[:10]:
            print('MATCH',seq,'size',len(out))
          print('TOP_BY_SIZE')
          for score,n,crc,seq,err in rows[:40]:
            print('seq',seq,'out',n,'diff',score[0],'crc',f'{crc:08x}','err',err[:80])
          PY

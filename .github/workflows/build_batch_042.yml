name: Repair Batch 042 payload

on:
  push:
    paths:
      - '.github/workflows/build_batch_042.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test full payload variants after first-byte repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          names=['1','2','3','3a','4','4a','4b','4c','5']
          raw={n:bytearray(base64.b64decode(Path(f'.github/batch042_payload_{n}.txt').read_text().strip())) for n in names}
          raw['1'][4736]=48
          variants={
            'v1':['1','2','3a','4a','4b','4c','5'],
            'v2':['1','2','3a','4','5'],
            'v3':['1','2','3','4a','4b','4c','5'],
            'v4':['1','2','3','4','5'],
            'v5':['1','2','3a','4a','4c','5'],
            'v6':['1','2','3a','4b','4c','5'],
            'v7':['1','2','3a','4a','4b','5'],
          }
          def test(buf):
              d=zlib.decompressobj(16+zlib.MAX_WBITS); out=bytearray()
              for i,b in enumerate(buf):
                  try: out += d.decompress(bytes([b]))
                  except Exception as e: return i,len(out),False,repr(e)
              try: out += d.flush()
              except Exception as e: return len(buf),len(out),False,'flush '+repr(e)
              return len(buf),len(out),bool(d.eof),'ok'
          lines=[]
          for k,seq in variants.items():
              buf=bytearray().join(raw[n] for n in seq)
              f,o,e,err=test(buf)
              lines.append(f'{k} seq={seq} raw={len(buf)} fail={f} out={o} eof={e} err={err}')
          Path('.github/batch042_repair_log.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/batch042_repair_log.txt
          git diff --cached --quiet || git commit -m 'Test Batch 042 repaired payload variants'
          git push

name: Inspect Batch 042 candidate text

on:
  push:
    paths:
      - '.github/workflows/build_batch_042.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract readable idea markers from candidate streams
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,re
          raw={n:bytearray(base64.b64decode(Path(f'.github/batch042_payload_{n}.txt').read_text().strip())) for n in ['1','2','3','3a','4a','4b','4c','5']}
          raw['1'][4736]=48
          variants=[
            ('A',['1','2','3','3a','4c','4a','5']),
            ('B',['1','2','3','3a','4a','4c','5']),
            ('C',['1','2','4c','3a','4a','3','5']),
            ('D',['1','2','3a','3','4a','4c','5']),
            ('E',['1','2','3a','4a','4c','3','5']),
          ]
          for tag,seq in variants:
              buf=bytearray().join(raw[n] for n in seq)
              p=10
              if buf[3]&8:
                  while buf[p]!=0:p+=1
                  p+=1
              d=zlib.decompressobj(-zlib.MAX_WBITS)
              try: out=d.decompress(bytes(buf[p:-8]))+d.flush()
              except Exception as e:
                  print('===',tag,'DECOMP ERROR',e); continue
              txt=out.decode('utf-8','ignore')
              print('\n=== VARIANT',tag,'SEQ',seq,'OUT',len(out),'===')
              # Show unique lines likely to identify an idea/source.
              seen=set()
              for line in txt.splitlines():
                  s=line.strip()
                  hit=(s.startswith('# ') or 'Idea ID:' in s or 'VIC Long' in s or 'VIC Short' in s or
                       'valueinvestorsclub.com/idea/' in s or s.startswith('**Security:**') or s.startswith('**Research direction:**'))
                  if hit and 3<=len(s)<=500 and s not in seen:
                      seen.add(s); print(s)
          PY

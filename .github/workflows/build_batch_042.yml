name: Repair Batch 042 payload

on:
  push:
    paths:
      - '.github/workflows/build_batch_042.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search single-byte corruption in first payload chunk
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,zlib

          s=Path('.github/batch042_payload_1.txt').read_text().strip()
          raw=bytearray(base64.b64decode(s))

          def test(buf,limit=None):
              d=zlib.decompressobj(16+zlib.MAX_WBITS)
              out=bytearray()
              n=len(buf) if limit is None else min(limit,len(buf))
              for i in range(n):
                  try:
                      out += d.decompress(bytes([buf[i]]))
                  except Exception as e:
                      return i,len(out),False,repr(e)
              return n,len(out),bool(d.eof),'ok'

          log=[]
          for step in range(12):
              fail,out,eof,err=test(raw)
              log.append(f'step={step} fail_raw={fail} out={out} eof={eof} err={err}')
              if fail>=len(raw):
                  break
              best=(fail,out,None,None)
              lo=max(0,fail-8); hi=min(len(raw)-1,fail+8)
              for pos in range(lo,hi+1):
                  orig=raw[pos]
                  for val in range(256):
                      if val==orig: continue
                      raw[pos]=val
                      f,o,e,_=test(raw)
                      score=(f,o)
                      if score>(best[0],best[1]):
                          best=(f,o,pos,val)
                  raw[pos]=orig
              if best[2] is None or best[0] <= fail:
                  log.append('NO_SINGLE_BYTE_IMPROVEMENT')
                  break
              pos,val=best[2],best[3]
              old=raw[pos]; raw[pos]=val
              log.append(f'REPAIR pos={pos} {old}->{val} new_fail={best[0]} new_out={best[1]}')
          fail,out,eof,err=test(raw)
          log.append(f'FINAL fail_raw={fail}/{len(raw)} out={out} eof={eof} err={err}')
          if fail==len(raw):
              Path('.github/batch042_payload_1_repaired.bin.b64').write_text(base64.b64encode(bytes(raw)).decode(),encoding='ascii')
          Path('.github/batch042_repair_log.txt').write_text('\n'.join(log),encoding='utf-8')
          print('\n'.join(log))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/batch042_repair_log.txt .github/batch042_payload_1_repaired.bin.b64 || true
          git diff --cached --quiet || git commit -m 'Diagnose Batch 042 compressed payload corruption'
          git push

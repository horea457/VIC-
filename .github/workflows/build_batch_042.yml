name: Solve Batch 042 corruption byte

on:
  push:
    paths:
      - '.github/workflows/build_batch_042.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brute-force exact gzip byte
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,zlib

          seq=['1','2','3a','4','5']
          parts=[bytearray(base64.b64decode(Path(f'.github/batch042_payload_{n}.txt').read_text().strip())) for n in seq]
          buf=bytearray().join(parts)
          pos=4736
          orig=buf[pos]

          def test(b):
              d=zlib.decompressobj(16+zlib.MAX_WBITS)
              out=bytearray()
              fail=len(b); err='ok'
              for i in range(0,len(b),256):
                  try: out += d.decompress(bytes(b[i:i+256]))
                  except Exception as e:
                      fail=i; err=repr(e); break
              else:
                  try: out += d.flush()
                  except Exception as e: err='flush '+repr(e)
              return fail,len(out),bool(d.eof),err,bytes(out)

          rows=[]; solved=[]
          for val in range(256):
              buf[pos]=val
              f,o,e,err,out=test(buf)
              rows.append((e,f,o,val,err))
              if e: solved.append((val,o,out))
          buf[pos]=orig
          rows.sort(reverse=True)
          lines=[f'orig={orig} pos={pos}',f'solved_values={[x[0] for x in solved]}']
          for e,f,o,val,err in rows[:40]:
              lines.append(f'val={val} eof={e} fail~={f} out={o} err={err}')
          Path('.github/batch042_exact_byte_log.txt').write_text('\n'.join(lines),encoding='utf-8')
          if solved:
              val,o,out=solved[0]
              Path('.github/batch042_solved_byte.txt').write_text(str(val),encoding='ascii')
              # Save decoded tar as base64 so a later workflow can extract it exactly.
              Path('.github/batch042_solved_tar.b64').write_text(base64.b64encode(out).decode('ascii'),encoding='ascii')
          print('\n'.join(lines))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/batch042_exact_byte_log.txt .github/batch042_solved_byte.txt .github/batch042_solved_tar.b64 || true
          git diff --cached --quiet || git commit -m 'Solve Batch 042 gzip corruption byte'
          git push

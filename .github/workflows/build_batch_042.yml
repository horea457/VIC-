name: Recover Batch 042 payload

on:
  push:
    paths:
      - '.github/workflows/build_batch_042.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Incremental payload recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, itertools, zlib, shutil

          ns=['1','2','3','3a','4','4a','4b','4c','5']
          c={n:Path(f'.github/batch042_payload_{n}.txt').read_text().strip() for n in ns}
          mids=['3','3a','4','4a','4b','4c']

          def decode_seq(seq):
              s=''.join(c[n] for n in seq)
              raw=base64.b64decode(s, validate=False)
              d=zlib.decompressobj(16+zlib.MAX_WBITS)
              out=bytearray()
              err='ok'
              pos=0
              for pos in range(0,len(raw),64):
                  piece=raw[pos:pos+64]
                  try:
                      out += d.decompress(piece)
                  except Exception as e:
                      err=f'@raw{pos} '+repr(e)
                      break
              else:
                  try: out += d.flush()
                  except Exception as e: err='flush '+repr(e)
              return bytes(out),bool(d.eof),err,len(raw)

          rows=[]
          candidates=[]
          # diagnostic prefixes first
          for seq in [('1',),('1','2')]:
              out,eof,err,rawlen=decode_seq(seq)
              rows.append((len(out),eof,seq,err,rawlen))
          # fixed 1,2; test each ordered subset, with and without trailing 5
          for L in range(1,len(mids)+1):
              for perm in itertools.permutations(mids,L):
                  for tail in [(),('5',)]:
                      seq=('1','2')+perm+tail
                      out,eof,err,rawlen=decode_seq(seq)
                      rows.append((len(out),eof,seq,err,rawlen))
                      candidates.append((len(out)+(10_000_000 if eof else 0),seq,out,eof,err,rawlen))
          candidates.sort(reverse=True,key=lambda x:x[0])
          best=candidates[0]
          rec=Path('.github/batch042_recovered')
          if rec.exists(): shutil.rmtree(rec)
          rec.mkdir(parents=True)
          lines=['TOP CANDIDATES']
          for score,seq,out,eof,err,rawlen in candidates[:50]:
              lines.append(f"out={len(out)} raw={rawlen} eof={eof} seq={','.join(seq)} err={err}")
          lines += ['','PREFIX TESTS']
          for n,eof,seq,err,rawlen in rows[:2]:
              lines.append(f"out={n} raw={rawlen} eof={eof} seq={','.join(seq)} err={err}")
          lines += ['','BEST='+','.join(best[1]),f'BEST_BYTES={len(best[2])} EOF={best[3]} ERR={best[4]} RAW={best[5]}']

          data=best[2]
          # Scan all 512 offsets for tar headers.
          found=[]
          for off in range(0,max(0,len(data)-512)+1,512):
              h=data[off:off+512]
              name=h[:100].split(b'\0',1)[0]
              magic=h[257:263]
              if not name or magic not in (b'ustar\x00',b'ustar '): continue
              try: size=int(h[124:136].split(b'\0',1)[0].strip() or b'0',8)
              except: continue
              typ=h[156:157]
              nstr=name.decode('utf-8','replace')
              found.append((off,nstr,size,typ.decode('latin1')))
              if typ in (b'0',b'\0'):
                  safe=Path(nstr)
                  if '..' not in safe.parts and not safe.is_absolute():
                      start=off+512; end=min(start+size,len(data))
                      if end>start:
                          p=rec/safe; p.parent.mkdir(parents=True,exist_ok=True)
                          p.write_bytes(data[start:end])
                          if end-start<size:
                              (p.parent/(p.name+'.PARTIAL')).write_text(f'recovered {end-start} of {size} bytes',encoding='utf-8')
          lines += ['','TAR_HEADERS']+[repr(x) for x in found]
          lines += ['','RECOVERED_FILES']
          for p in sorted(rec.rglob('*')):
              if p.is_file(): lines.append(f'{p.relative_to(rec)}\t{p.stat().st_size}')
          # Save UTF-8-clean mirrors so partially corrupted markdown can still be inspected.
          for p in sorted(rec.rglob('*.md')):
              try:
                  raw=p.read_bytes()
                  clean=raw.decode('utf-8','ignore')
                  (p.parent/(p.name+'.clean.txt')).write_text(clean,encoding='utf-8')
              except Exception:
                  pass
          Path('.github/batch042_recovery_inventory.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:180]))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/batch042_recovery_inventory.txt .github/batch042_recovered
          git diff --cached --quiet || git commit -m 'Improve Batch 042 payload recovery'
          git push

name: Diagnose Batch 042 payload

on:
  push:
    paths:
      - '.github/workflows/build_batch_042.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect payload boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          ns=['1','2','3','3a','4','4a','4b','4c','5']
          c={n:Path(f'.github/batch042_payload_{n}.txt').read_text().strip() for n in ns}
          def ov(a,b):
              m=min(len(a),len(b),1000)
              for k in range(m,0,-1):
                  if a[-k:]==b[:k]: return k
              return 0
          for x,y in [('1','2'),('2','3a'),('3a','4a'),('4a','4b'),('4b','4c'),('4c','5'),('3a','4'),('3','4'),('4','5')]:
              print(x,y,'overlap',ov(c[x],c[y]),'tail',c[x][-80:],'head',c[y][:80])
          PY

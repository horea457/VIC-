name: Diagnose Batch 042 payload

on:
  push:
    paths:
      - '.github/workflows/build_batch_042.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test stored payload variants
        shell: bash
        run: |
          set -u
          echo 'sizes:'
          wc -c .github/batch042_payload_*.txt
          test_variant() {
            name="$1"; shift
            cat "$@" | base64 -d > "/tmp/${name}.tgz" 2>"/tmp/${name}.b64err" || true
            echo "-- ${name} --"
            gzip -t "/tmp/${name}.tgz" && echo "CRC_OK ${name}" || echo "CRC_FAIL ${name}"
          }
          test_variant v1 .github/batch042_payload_1.txt .github/batch042_payload_2.txt .github/batch042_payload_3a.txt .github/batch042_payload_4a.txt .github/batch042_payload_4b.txt .github/batch042_payload_4c.txt .github/batch042_payload_5.txt
          test_variant v2 .github/batch042_payload_1.txt .github/batch042_payload_2.txt .github/batch042_payload_3a.txt .github/batch042_payload_4.txt .github/batch042_payload_5.txt
          test_variant v3 .github/batch042_payload_1.txt .github/batch042_payload_2.txt .github/batch042_payload_3.txt .github/batch042_payload_4a.txt .github/batch042_payload_4b.txt .github/batch042_payload_4c.txt .github/batch042_payload_5.txt
          test_variant v4 .github/batch042_payload_1.txt .github/batch042_payload_2.txt .github/batch042_payload_3.txt .github/batch042_payload_4.txt .github/batch042_payload_5.txt

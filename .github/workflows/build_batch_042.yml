name: Recover Batch 042 full payload

on:
  push:
    paths:
      - '.github/workflows/build_batch_042.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and extract recovered Batch 042
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,shutil

          seq=['1','2','3a','4','5']
          raws=[]
          for n in seq:
              b=bytearray(base64.b64decode(Path(f'.github/batch042_payload_{n}.txt').read_text().strip()))
              if n=='1': b[4736]=48
              raws.append(b)
          buf=bytearray().join(raws)
          d=zlib.decompressobj(16+zlib.MAX_WBITS)
          out=bytearray(); err='ok'; fail=len(buf)
          for i,b in enumerate(buf):
              try: out += d.decompress(bytes([b]))
              except Exception as e:
                  fail=i; err=repr(e); break
          data=bytes(out)

          root=Path('.github/batch042_recovered_v2')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          headers=[]
          for off in range(0,max(0,len(data)-512)+1,512):
              h=data[off:off+512]
              name=h[:100].split(b'\0',1)[0]
              magic=h[257:263]
              if not name or magic not in (b'ustar\x00',b'ustar '): continue
              try: size=int(h[124:136].split(b'\0',1)[0].strip() or b'0',8)
              except: continue
              typ=h[156:157]
              nstr=name.decode('utf-8','replace')
              headers.append((off,nstr,size,typ.decode('latin1')))
              if typ in (b'0',b'\0'):
                  start=off+512; end=start+size
                  if end<=len(data):
                      p=root/nstr
                      if '..' not in p.parts:
                          p.parent.mkdir(parents=True,exist_ok=True)
                          payload=data[start:end]
                          p.write_bytes(payload)
                          if p.suffix in ('.md','.json','.txt'):
                              (p.parent/(p.name+'.clean.txt')).write_text(payload.decode('utf-8','ignore'),encoding='utf-8')
          lines=[f'raw={len(buf)} fail={fail} out={len(data)} err={err}','HEADERS']
          lines += [repr(x) for x in headers]
          lines += ['FILES']
          for p in sorted(root.rglob('*')):
              if p.is_file() and not p.name.endswith('.clean.txt'):
                  lines.append(f'{p.relative_to(root)}\t{p.stat().st_size}')
          Path('.github/batch042_recovered_v2_inventory.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:250]))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/batch042_recovered_v2 .github/batch042_recovered_v2_inventory.txt
          git diff --cached --quiet || git commit -m 'Recover full Batch 042 payload contents'
          git push

name: Recover Batch 031 partial
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_recover_b031_partial.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_recover_b031_partial.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .vic_tmp/b031_partial.md
          git rm scripts/_recover_b031_partial.py .github/workflows/_recover_b031_partial.yml
          git commit -m 'Recover Batch 031 partial draft'
          git push origin main

name: Rank unreviewed VIC ideas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_rank_unreviewed.yml']
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_rank_unreviewed.py
      - name: Save ranking
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add .vic_tmp/next_unreviewed_rank.json
          git commit -m 'Save unreviewed VIC ranking'
          git push origin main

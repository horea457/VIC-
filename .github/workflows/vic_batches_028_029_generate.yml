name: Generate VIC Batches 028 029
on:
  push:
    branches: [main]
    paths:
      - 'scripts/batch028_rows.txt'
      - 'scripts/batch029_rows.txt'
      - 'scripts/g2829_a'
      - 'scripts/g2829_b'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate
        run: |
          cat scripts/g2829_a scripts/g2829_b > scripts/gen_batches_028_029.py
          python scripts/gen_batches_028_029.py
      - name: Commit validated batches
        run: |
          rm -f scripts/g2829_a scripts/g2829_b scripts/gen_batches_028_029.py scripts/batch028_rows.txt scripts/batch029_rows.txt scripts/batch027_rows.txt .github/workflows/vic_batches_028_029_generate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add VIC batches 028-029 [skip ci]'
          git push

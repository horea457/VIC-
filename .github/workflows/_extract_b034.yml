name: Extract B034 metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_extract_b034.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_extract_b034.py
      - name: Save extracted metadata
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add .vic_tmp/b034_source.json
          git commit -m 'Save Batch 034 source rows'
          git push origin main

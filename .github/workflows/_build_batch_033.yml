name: Build Batch 033 sequentially
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_build_batch_033.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate
        run: python scripts/_build_batch_033.py
      - name: Commit analysis
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add analysis/batch_033_pico_grace_10.md
          git commit -m 'Add Batch 033 PICO GRA analysis'
          git push origin main
      - name: Commit curated data
        run: |
          git add data/curated/batch_033_pico_grace_deep_v7.json
          git commit -m 'Add Batch 033 PICO GRA curated data'
          git push origin main
      - name: Register report
        run: |
          git add app/components/batch_report.py
          git commit -m 'Register Batch 033 report'
          git push origin main
      - name: Cleanup staging
        run: |
          git rm scripts/_build_batch_033.py .github/workflows/_build_batch_033.yml
          test ! -f scripts/_extract_b033.py || git rm scripts/_extract_b033.py
          test ! -f .github/workflows/_extract_b033.yml || git rm .github/workflows/_extract_b033.yml
          test ! -f .vic_tmp/b033_source.json || git rm .vic_tmp/b033_source.json
          test ! -f scripts/_extract_b033_exact.py || git rm scripts/_extract_b033_exact.py
          test ! -f .github/workflows/_extract_b033_exact.yml || git rm .github/workflows/_extract_b033_exact.yml
          test ! -f .vic_tmp/b033_exact.json || git rm .vic_tmp/b033_exact.json
          git commit -m 'Clean Batch 033 staging helpers'
          git push origin main

name: Build Batch 045 source packet

on:
  push:
    paths:
      - '.github/workflows/build_batch_045.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Batch 045 source packet from SQL-derived metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, shutil
          root=json.load(open('data/curated/source_true_unreviewed.json',encoding='utf-8'))
          used=set()
          for p in ['data/curated/batch_043_source_packet.json','data/curated/batch_044_source_packet.json']:
              j=json.load(open(p,encoding='utf-8'))
              used.update(x['idea_id'] for x in j.get('candidates',[]))

          records=[]
          def walk(x):
              if isinstance(x,dict):
                  if 'idea_id' in x and 'ticker' in x:
                      records.append(dict(x))
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(root)

          # de-duplicate by idea_id, preserve first occurrence
          ded={}
          for r in records: ded.setdefault(r['idea_id'],r)
          records=list(ded.values())
          plus=sorted([r for r in records if r.get('ticker')=='PLUS' and r['idea_id'] not in used], key=lambda x:x.get('date',''))
          bco=sorted([r for r in records if r.get('ticker')=='BCO' and r['idea_id'] not in used], key=lambda x:x.get('date',''))

          candidates=(plus[:4]+bco[:6])[:10]
          packet={
              'batch':'045','format':'V9-per-idea',
              'source':'data/curated/source_true_unreviewed.json (SQL-derived)',
              'excluded_prior_ids':sorted(used),
              'record_count_found':len(records),
              'remaining_plus_count':len(plus),'bco_count':len(bco),
              'candidate_count':len(candidates),'candidates':candidates
          }
          pathlib.Path('data/curated/batch_045_source_packet.json').write_text(json.dumps(packet,ensure_ascii=False,indent=2),encoding='utf-8')

          # Preserve available original PLUS source texts from Batch 035 for the four remaining ePlus ideas.
          out=pathlib.Path('data/source_batch045'); out.mkdir(exist_ok=True)
          ids={x['idea_id'] for x in candidates}
          for p in pathlib.Path('data/source_batch035').glob('*.md'):
              if any(i in p.name for i in ids):
                  shutil.copy2(p,out/p.name)
          print(json.dumps({'records':len(records),'plus':len(plus),'bco':len(bco),'candidates':[(x.get('ticker'),x.get('idea_id'),x.get('date')) for x in candidates]},ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/curated/batch_045_source_packet.json data/source_batch045 || true
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare Batch 045 V9 source packet'
            git pull --rebase origin main
            git push
          fi

name: Extract Batch 031 source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_extract_b031.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract source rows from pre-curated history
        run: python scripts/_extract_b031.py
      - name: Commit source extract and remove one-time extractor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .vic_tmp/b031_source.json
          git rm scripts/_extract_b031.py .github/workflows/_extract_b031.yml
          git commit -m 'Extract Batch 031 source rows'
          git push origin main

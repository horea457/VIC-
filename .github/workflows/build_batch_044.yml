name: Prepare Batch 044 V9

on:
  push:
    paths:
      - '.github/workflows/build_batch_044.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select next 10 unreviewed ideas after Batch 043
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          src=json.loads(Path('data/curated/source_true_unreviewed.json').read_text(encoding='utf-8'))
          b43=json.loads(Path('data/curated/batch_043_source_packet.json').read_text(encoding='utf-8'))
          excluded={x['idea_id'] for x in b43['candidates']}
          cand=[]
          for x in src.get('next_candidates',[]):
              if x.get('idea_id') in excluded:
                  continue
              cand.append(x)
              if len(cand)==10:
                  break
          assert len(cand)==10, len(cand)
          packet={'batch':'044','format':'V9-per-idea','source':'data/curated/source_true_unreviewed.json','excluded_batch_043_ids':sorted(excluded),'candidate_count':len(cand),'candidates':cand}
          Path('data/curated/batch_044_source_packet.json').write_text(json.dumps(packet,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=['# Batch 044 — V9 Candidate Index','', '> Batch 003 V9 규칙 적용: 투자시점별 독립 Idea Unit, claim-level C1/C2/... 검증, 실제 성과와 사후검증 중심.','', '| # | VIC date | ticker | company | raw flag | idea id | source |','|---:|---|---|---|---|---|---|']
          for i,x in enumerate(cand,1):
              d=x.get('date',''); t=x.get('ticker',''); co=x.get('company_name',''); flag='Short' if x.get('is_short') else 'Long'; iid=x.get('idea_id',''); url=x.get('source_link')
              srcmd=f'[VIC]({url})' if url else 'source link missing'
              lines.append(f'| {i} | {d} | {t} | {co} | {flag} | `{iid}` | {srcmd} |')
          lines += ['', '## 작업 규칙', '', '- raw SQL flag는 보존하고 실제 VIC 방향/security는 별도 검증한다.', '- 동일 회사라도 게시일이 다르면 별도 canonical idea 파일로 분리한다.', '- 각 Idea는 회사/산업/돈의 흐름을 설명한 뒤 C1/C2/... 개별 thesis로 분해한다.', '- 각 Claim마다 당시 근거, 숨은 가정, 사전 반증조건, 실제 결과, 판정을 기록한다.', '- 목표가 IRR보다 실제 게시가격→실제 후속가격/exit 기준 수익률과 IRR을 우선한다.', '- Business / valuation / catalyst / timing / security-selection을 별도 판정한다.']
          Path('analysis/batch_044_v9_index.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/curated/batch_044_source_packet.json analysis/batch_044_v9_index.md
          git commit -m 'Initialize Batch 044 V9 candidate set'
          git push
